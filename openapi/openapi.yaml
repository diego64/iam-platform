openapi: 3.1.0
info:
  title: Custom IAM API
  version: 0.1.0
  contact:
    name: Equipe iam-platform
    url: https://github.com/diego64/iam-platform
  description: >
    Provedor de Identidade (IdP/SSO). Emissão e validação de tokens para microsserviços.
    Autenticação via Bearer Token (JWT EdDSA) e fluxos OAuth2 (password, client_credentials, refresh_token).
tags:
  - name: health
    description: Sondas de disponibilidade consumidas por Docker e Render.
  - name: password
    description: Troca, recuperação e política de senha.
  - name: users
    description: Administração de usuários (CRUD e ciclo de status). Restrito a administradores.
  - name: observability
    description: Exposição de métricas para raspagem pelo Prometheus.
  - name: jwks
    description: Publicação das chaves públicas de verificação (JWK Set).
  - name: keys
    description: >-
      Administração das chaves de assinatura. A rotação acontece em duas fases separadas no
      tempo: preparar publica a próxima chave no JWKS, e promover só é aceito depois que ela
      ficou visível tempo suficiente para os consumidores a conhecerem.
  - name: auth
    description: Login, logout e perfil do usuário autenticado.
  - name: rbac
    description: Papéis, permissões e suas associações. Autorização por permissão (guard).
  - name: clients
    description: >-
      Clientes de API — a identidade de uma aplicação, não de uma pessoa. O escopo concedido
      é o nome de uma permissão do catálogo do RBAC, então o mesmo guard autoriza token de
      usuário e token de cliente.
  - name: audit
    description: >-
      Trilha de auditoria append-only. Encadeada por hash e ancorada no PostgreSQL: a leitura
      mostra o que aconteceu, e a verificação diz se alguém mexeu no registro depois. Não há
      rota de escrita — a trilha é alimentada de dentro do processo.
  - name: abac
    description: >-
      Políticas por atributo sobre o RBAC. A decisão é sempre server-side (PDP/PEP) e nunca
      entra no token: uma condição sobre o recurso precisa do recurso em mãos.
  - name: mfa
    description: >-
      Segundo fator (TOTP e códigos de recuperação). Com fator ativo, `POST /auth/login`
      devolve um desafio em vez dos tokens, e `POST /auth/mfa/verify` o troca pelo par. Quem
      não tem fator não percebe diferença.
  - name: oauth
    description: >-
      Superfície OAuth 2.0 (RFC 6749). O corpo é form-urlencoded e o erro segue o formato da
      própria RFC, não o problem+json do resto da plataforma: nenhuma biblioteca cliente de
      OAuth lê problem+json. A autoridade do token emitido é a interseção do que foi pedido,
      do que o cliente tem e do que o sujeito tem — um cliente nunca emite token com mais
      permissão do que ele próprio possui.
servers:
  - url: http://localhost:3000
    description: Desenvolvimento local
components:
  schemas:
    Jwk:
      type: object
      additionalProperties: false
      required: [kty, crv, x, kid, use, alg]
      properties:
        kty:
          type: string
          enum: [OKP]
        crv:
          type: string
          enum: [Ed25519]
        x:
          type: string
          description: Chave pública Ed25519 em base64url.
        kid:
          type: string
        use:
          type: string
          enum: [sig]
        alg:
          type: string
          enum: [EdDSA]
    JwksResponse:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/Jwk'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        senha:
          type: string
          minLength: 8
          maxLength: 128
    LoginResponse:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
    DesafioDeMfa:
      type: object
      additionalProperties: false
      required: [mfa_required, mfa_token, expires_in]
      properties:
        mfa_required:
          type: boolean
          enum: [true]
        mfa_token:
          type: string
          description: Opaco, de uso único, válido por poucos minutos.
        expires_in:
          type: integer
    EstadoDeMfa:
      type: object
      additionalProperties: false
      required: [enabled, status, type, confirmed_at, last_used_at, recovery_codes_remaining]
      properties:
        enabled:
          type: boolean
        status:
          type: string
          enum: [active, pending, none]
        type:
          type: string
          nullable: true
          enum: [totp]
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        recovery_codes_remaining:
          type: integer
    CadastroDeTotp:
      type: object
      additionalProperties: false
      required: [secret, otpauth_uri]
      properties:
        secret:
          type: string
          description: Base32 do segredo. Aparece uma única vez.
        otpauth_uri:
          type: string
          description: URI que o aplicativo autenticador lê do QR Code.
    ConfirmacaoDeTotp:
      type: object
      additionalProperties: false
      required: [status, confirmed_at, recovery_codes]
      properties:
        status:
          type: string
          enum: [active]
        confirmed_at:
          type: string
          format: date-time
        recovery_codes:
          type: array
          description: Entregues uma única vez; não há endpoint para recuperá-los.
          items:
            type: string
    CodigosDeRecuperacao:
      type: object
      additionalProperties: false
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items:
            type: string
    TokenRequest:
      type: object
      # Sem `additionalProperties: false`: a RFC 6749 §3.2 manda ignorar parâmetro
      # desconhecido, e cliente pronto manda extras (`audience`, `resource`).
      required: [grant_type]
      properties:
        grant_type:
          type: string
          description: >-
            `client_credentials`, `password` ou `refresh_token`. Valor fora dessa lista
            responde `unsupported_grant_type`.
          maxLength: 64
        scope:
          type: string
          description: Nomes de permissão separados por espaço (`orders:read orders:write`).
          maxLength: 2048
        client_id:
          type: string
          maxLength: 128
        client_secret:
          type: string
          maxLength: 256
        username:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 128
        refresh_token:
          type: string
          maxLength: 512
    TokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
        scope:
          type: string
          description: >-
            Escopo efetivamente concedido, que pode ser menor que o solicitado quando o
            sujeito tem menos autoridade que o cliente (RFC 6749 §5.1).
        refresh_token:
          type: string
          description: Ausente em `client_credentials` (RFC 6749 §4.4.3).
    OAuthError:
      type: object
      additionalProperties: false
      required: [error, error_description]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - invalid_scope
            - slow_down
            - server_error
        error_description:
          type: string
    AuthorizationServerMetadata:
      type: object
      additionalProperties: false
      required:
        - issuer
        - token_endpoint
        - jwks_uri
        - grant_types_supported
        - token_endpoint_auth_methods_supported
        - response_types_supported
        - scopes_supported
      properties:
        issuer:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        jwks_uri:
          type: string
          format: uri
        grant_types_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        response_types_supported:
          type: array
          description: Vazio — sem `authorization_code`, não há response type.
          items:
            type: string
        scopes_supported:
          type: array
          items:
            type: string
    LogoutRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 88
          maxLength: 88
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 88
          maxLength: 88
    RefreshResponse:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
    MeResponse:
      type: object
      additionalProperties: false
      required: [id, email, status, roles]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
        roles:
          type: array
          items:
            type: string
    Dependencia:
      type: object
      additionalProperties: false
      required: [nome, estado, duracao_ms]
      properties:
        nome:
          type: string
          enum: [postgres, mongodb]
        estado:
          type: string
          enum: [up, down]
        duracao_ms:
          type: integer
          minimum: 0
        motivo:
          type: string
          description: >
            Categoria fixa, nunca a mensagem do driver — ela traz host, porta e usuário,
            e esta resposta é pública e sem autenticação.
          enum: [timeout, indisponivel, erro_interno]
    Prontidao:
      type: object
      additionalProperties: false
      required: [status, dependencias]
      properties:
        status:
          type: string
          enum: [ready]
        dependencias:
          type: array
          items: { $ref: '#/components/schemas/Dependencia' }
    Problem:
      type: object
      description: Erro no formato RFC 7807.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Usuario:
      type: object
      additionalProperties: false
      description: Representação pública do usuário — nunca inclui o hash de senha.
      required: [id, email, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        status: { type: string, enum: [active, blocked] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ApiClient:
      type: object
      # additionalProperties: false é a garantia de contrato de que nenhum campo de segredo
      # escapa por esta rota — não é só estilo.
      additionalProperties: false
      required:
        [
          id,
          client_id,
          name,
          description,
          status,
          scopes,
          grant_types,
          access_token_ttl_seconds,
          created_at,
          updated_at,
          last_used_at,
          secret_rotated_at,
          previous_secret_expires_at,
        ]
      properties:
        id: { type: string, format: uuid }
        client_id: { type: string, description: 'Identificador público, prefixado por cli_.' }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [active, disabled, deleted] }
        scopes:
          type: array
          items: { type: string }
          description: Nomes de permissão do catálogo concedidos a este cliente.
        grant_types:
          type: array
          items: { type: string, enum: [client_credentials, password, refresh_token] }
        access_token_ttl_seconds:
          type: integer
          nullable: true
          description: Nulo usa o TTL global de access token.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        secret_rotated_at: { type: string, format: date-time, nullable: true }
        previous_secret_expires_at:
          type: string
          format: date-time
          nullable: true
          description: Até quando o segredo anterior ainda autentica.
    ApiClientCreated:
      allOf:
        - $ref: '#/components/schemas/ApiClient'
        - type: object
          required: [client_secret]
          properties:
            client_secret:
              type: string
              description: >-
                Segredo em claro. Aparece nesta resposta e na rotação, e em nenhum outro
                lugar — não há endpoint para recuperá-lo.
    KeyMetadata:
      type: object
      # additionalProperties: false é a garantia de contrato de que nenhum campo de material
      # de chave escapa por esta rota — não é só estilo.
      additionalProperties: false
      required:
        [
          kid,
          algorithm,
          status,
          created_at,
          activated_at,
          retired_at,
          verifiable_until,
          age_seconds,
        ]
      properties:
        kid: { type: string, format: uuid }
        algorithm: { type: string, enum: [EdDSA] }
        status: { type: string, enum: [active, next, retired] }
        created_at: { type: string, format: date-time }
        activated_at: { type: string, format: date-time, nullable: true }
        retired_at: { type: string, format: date-time, nullable: true }
        verifiable_until:
          type: string
          format: date-time
          nullable: true
          description: Instante em que a chave deixa de verificar tokens.
        age_seconds: { type: integer, minimum: 0 }
    ApiClientList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiClient' }
        total: { type: integer }
    KeyList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/KeyMetadata' }
        total: { type: integer }
    RotatedSecret:
      type: object
      additionalProperties: false
      required: [client_id, client_secret, secret_rotated_at, previous_secret_expires_at]
      properties:
        client_id: { type: string }
        client_secret: { type: string, description: 'Segredo novo em claro, exibido uma vez.' }
        secret_rotated_at: { type: string, format: date-time }
        previous_secret_expires_at:
          type: string
          format: date-time
          nullable: true
          description: Nulo quando a rotação foi pedida sem janela de sobreposição.
    PreparedKey:
      type: object
      additionalProperties: false
      required: [kid, status, created_at, rotatable_at]
      properties:
        kid: { type: string, format: uuid }
        status: { type: string, enum: [next] }
        created_at: { type: string, format: date-time }
        rotatable_at:
          type: string
          format: date-time
          description: A partir de quando a promoção deixa de responder 409.
    RotationResult:
      type: object
      additionalProperties: false
      required: [previous_kid, active_kid, next_kid, verifiable_until]
      properties:
        previous_kid: { type: string, format: uuid, nullable: true }
        active_kid: { type: string, format: uuid }
        next_kid: { type: string, format: uuid }
        verifiable_until:
          type: string
          format: date-time
          nullable: true
          description: Até quando a chave aposentada ainda verifica os tokens já emitidos.
    RevocationResult:
      type: object
      additionalProperties: false
      required: [revoked_kid, active_kid, tokens_invalidated]
      properties:
        revoked_kid: { type: string, format: uuid }
        active_kid: { type: string, format: uuid, nullable: true }
        tokens_invalidated:
          type: boolean
          description: Falso quando a chave era apenas pré-publicada e nunca assinou nada.
    Role:
      type: object
      additionalProperties: false
      required: [id, name, description, is_system]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        is_system: { type: boolean }
    RoleDetail:
      type: object
      additionalProperties: false
      required: [id, name, description, is_system, permissions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        is_system: { type: boolean }
        permissions:
          type: array
          items: { type: string }
    Permission:
      type: object
      additionalProperties: false
      required: [id, name, description, is_system]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        is_system: { type: boolean }
    RoleList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        total: { type: integer }
    PermissionList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
        total: { type: integer }
    UserRoles:
      type: object
      additionalProperties: false
      required: [user_id, roles]
      properties:
        user_id: { type: string, format: uuid }
        roles:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
    PolicyCondition:
      description: >-
        Condição na gramática fechada: operadores whitelisted, sem regex e sem execução de
        dado. Limites de forma — profundidade <= 10 e <= 100 nós — recusados com 400 na borda.
      type: object
      required: [op]
      properties:
        op:
          type: string
          enum: [and, or, not, eq, ne, gt, gte, lt, lte, in, contains]
        attr:
          description: Caminho no contexto (subject.*, resource.*, action, env.*).
          type: string
          maxLength: 128
        value:
          description: Literal, lista de literais (`in`) ou `{ ref }` apontando outro atributo.
        of:
          description: Filhos dos operadores lógicos.
          type: array
          items: { $ref: '#/components/schemas/PolicyCondition' }
    Policy:
      type: object
      required: [id, name, effect, resource_type, action, priority, enabled, is_system]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        effect: { type: string, enum: [permit, deny] }
        resource_type: { type: string }
        action: { type: string }
        priority: { type: integer }
        enabled: { type: boolean }
        is_system: { type: boolean }
    PolicyDetail:
      allOf:
        - $ref: '#/components/schemas/Policy'
        - type: object
          required: [description, condition]
          properties:
            description: { type: string, nullable: true }
            condition: { $ref: '#/components/schemas/PolicyCondition' }
    PolicyList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Policy' }
        total: { type: integer }
    PolicyDecision:
      type: object
      required: [effect, reason]
      properties:
        effect: { type: string, enum: [permit, deny] }
        policy_id:
          description: Política decisiva. Ausente quando nenhuma política aplicável foi satisfeita.
          type: string
          format: uuid
        reason: { type: string, enum: [matched, no-applicable-policy] }
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        [
          seq,
          event_id,
          type,
          occurred_at,
          actor,
          target,
          outcome,
          reason,
          subject_hint,
          metadata,
          request_id,
          trace_id,
          hash,
        ]
      properties:
        seq: { type: integer, description: 'Posição na cadeia: contígua e única' }
        event_id: { type: string }
        type: { type: string, example: iam.auth.login_failed }
        occurred_at: { type: string, format: date-time }
        actor:
          type: object
          additionalProperties: false
          required: [id, type]
          properties:
            id:
              type: string
              nullable: true
              description: Nulo quando a operação não tinha ninguém autenticado.
            type: { type: string, enum: [user, client, system] }
            ip: { type: string }
            user_agent: { type: string }
        target:
          type: object
          nullable: true
          additionalProperties: false
          required: [id, type]
          properties:
            id: { type: string }
            type: { type: string, enum: [user, role, client, key, session] }
        outcome: { type: string, enum: [success, failure] }
        reason: { type: string, nullable: true }
        subject_hint:
          type: string
          nullable: true
          description: >-
            sha256 do e-mail com pepper, presente quando não há ator identificado. Existe para
            correlacionar tentativas contra o mesmo alvo sem guardar o endereço.
        metadata: { type: object, additionalProperties: true }
        request_id: { type: string, nullable: true }
        trace_id: { type: string, nullable: true }
        hash: { type: string }
    AuditEventDetail:
      allOf:
        - $ref: '#/components/schemas/AuditEvent'
        - type: object
          required: [prev_hash]
          properties:
            prev_hash: { type: string }
    AuditEventPage:
      type: object
      additionalProperties: false
      required: [itens, proximo_cursor, tem_mais]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        proximo_cursor: { type: integer, nullable: true }
        tem_mais: { type: boolean }
    AuditIntegrityReport:
      type: object
      additionalProperties: false
      required: [integra, de, ate, verificados, primeira_quebra, checkpoint_conferido]
      properties:
        integra: { type: boolean }
        de: { type: integer }
        ate: { type: integer }
        verificados: { type: integer }
        primeira_quebra:
          type: object
          nullable: true
          additionalProperties: false
          required: [seq, motivo]
          properties:
            seq: { type: integer }
            motivo:
              type: string
              enum: [hash-divergente, elo-quebrado, seq-faltante, checkpoint-divergente]
        checkpoint_conferido:
          type: object
          nullable: true
          additionalProperties: false
          required: [seq, hash, confere]
          properties:
            seq: { type: integer }
            hash: { type: string }
            confere: { type: boolean }
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ProblemValidacao:
      description: Payload inválido (RFC 7807)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemNaoAutenticado:
      description: Token ausente, inválido ou revogado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemSemPermissao:
      description: Autenticado, mas sem a permissão/papel exigido
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemNaoEncontrado:
      description: Recurso não encontrado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemConflito:
      description: Conflito — recurso de sistema imutável ou nome já existente
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemMetodoNaoPermitido:
      description: Método recusado por contrato
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ProblemTrilhaIndisponivel:
      description: Falha ao ler a trilha ou as âncoras
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
paths:
  /health/live:
    get:
      tags: [health]
      summary: Liveness probe
      description: >
        Indica que o processo está vivo. NÃO consulta PostgreSQL nem MongoDB: banco
        fora não se resolve reiniciando o processo. A checagem de dependências é
        readiness (/health/ready), entregue pela SPEC 017.
      operationId: healthLive
      security: []
      responses:
        '200':
          description: Processo vivo
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, uptime_seconds]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  uptime_seconds:
                    type: integer
                    minimum: 0
              example:
                status: ok
                uptime_seconds: 1042
        '404':
          description: Recurso não encontrado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /health/ready:
    get:
      tags: [health]
      summary: Readiness probe
      description: >
        Indica se o serviço consegue ATENDER: verifica PostgreSQL e MongoDB.
        Diferente de /health/live, que indica apenas que o processo está vivo — um
        liveness que checasse dependência viraria restart loop e derrubaria também as
        réplicas que ainda serviam.
      operationId: healthReady
      security: []
      responses:
        '200':
          description: Pronto para receber tráfego
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prontidao'
              example:
                status: ready
                dependencias:
                  - { nome: postgres, estado: up, duracao_ms: 3 }
                  - { nome: mongodb, estado: up, duracao_ms: 5 }
        '503':
          description: Dependência indisponível ou instância encerrando
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://iam.example.com/problems/service-unavailable
                title: Serviço indisponível
                status: 503
                detail: 'Dependências indisponíveis: postgres'
  /auth/password/change:
    post:
      tags: [password]
      summary: Troca a senha do usuário autenticado
      description: >
        Exige a senha atual. Em sucesso, revoga todas as sessões do usuário e
        invalida tokens de reset pendentes.
      operationId: passwordChange
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [senha_atual, senha_nova]
              properties:
                senha_atual: { type: string, minLength: 1, maxLength: 128 }
                senha_nova: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '204':
          description: Senha trocada
        '400':
          description: Payload inválido, política reprovada ou senha reutilizada
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: Não autenticado ou senha atual incorreta
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: Limite de tentativas excedido
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /auth/password/forgot:
    post:
      tags: [password]
      summary: Solicita a recuperação de senha
      description: >
        Responde 202 sempre, exista o e-mail ou não, para não revelar quais contas
        existem. Para e-mail existente e ativo, envia um token de reset.
      operationId: passwordForgot
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202':
          description: Requisição aceita (resposta idêntica para e-mail existente ou não)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '429':
          description: Limite de tentativas excedido
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /auth/password/reset:
    post:
      tags: [password]
      summary: Redefine a senha a partir de um token de reset
      description: >
        Consome o token de reset (uso único). Em sucesso, revoga todas as sessões do
        usuário. Token inválido, expirado ou já usado retornam o mesmo erro genérico.
      operationId: passwordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, senha_nova]
              properties:
                token: { type: string, minLength: 43, maxLength: 43 }
                senha_nova: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '204':
          description: Senha redefinida
        '400':
          description: Token inválido/expirado/usado, política reprovada ou senha reutilizada
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: Limite de tentativas excedido
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /auth/password/policy:
    get:
      tags: [password]
      summary: Regras vigentes de força de senha
      description: >
        Expõe os parâmetros da política (comprimento e classes exigidas) para o cliente
        montar validação e mensagens; a fonte da verdade continua no servidor.
      operationId: passwordPolicy
      security: []
      responses:
        '200':
          description: Parâmetros da política
          content:
            application/json:
              schema:
                type: object
                properties:
                  min_length: { type: integer }
                  max_length: { type: integer }
                  required_classes: { type: integer }
                  classes:
                    type: array
                    items: { type: string }
                  blocks_common_passwords: { type: boolean }
  /users:
    post:
      tags: [users]
      summary: Cria um usuário
      description: Restrito a administradores. A senha passa pela política e é hasheada; nunca é retornada.
      operationId: usersCreate
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, senha]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                senha: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400':
          description: Payload inválido ou senha fora da política
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: Não autenticado
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Autenticado sem papel de administrador
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: E-mail já cadastrado
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: Limite de tentativas excedido
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [users]
      summary: Lista usuários com paginação e filtro de status
      description: Restrito a administradores. Ordena do mais recente ao mais antigo.
      operationId: usersList
      security: [{ BearerAuth: [] }]
      parameters:
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: status, schema: { type: string, enum: [active, blocked] } }
      responses:
        '200':
          description: Página de usuários
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Usuario' }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '401':
          description: Não autenticado
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Autenticado sem papel de administrador
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /users/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [users]
      summary: Busca um usuário por id
      description: Restrito a administradores. Retorna o DTO público, sem hash de senha.
      operationId: usersGet
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Usuário
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401':
          description: Não autenticado
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Autenticado sem papel de administrador
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Usuário não encontrado
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    patch:
      tags: [users]
      summary: Atualiza o e-mail de um usuário
      description: Restrito a administradores. Único campo mutável por aqui é o e-mail.
      operationId: usersUpdate
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400':
          description: Payload inválido
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Usuário não encontrado
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: E-mail já cadastrado
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [users]
      summary: Remove um usuário e revoga suas sessões
      description: Restrito a administradores. Hard delete; user_roles e password_history caem por cascade.
      operationId: usersDelete
      security: [{ BearerAuth: [] }]
      responses:
        '204':
          description: Usuário removido
        '401':
          description: Não autenticado
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Autenticado sem papel de administrador
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Usuário não encontrado
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /users/{id}/block:
    post:
      tags: [users]
      summary: Bloqueia um usuário e revoga suas sessões
      description: Idempotente. Bloquear derruba todas as sessões vivas do usuário.
      operationId: usersBlock
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Estado de bloqueio do usuário
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [blocked] }
        '404':
          description: Usuário não encontrado
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /users/{id}/unblock:
    post:
      tags: [users]
      summary: Desbloqueia um usuário
      description: Restrito a administradores. Idempotente. Não recria sessões.
      operationId: usersUnblock
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Estado do usuário
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [active] }
        '404':
          description: Usuário não encontrado
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /metrics:
    get:
      tags: [observability]
      summary: Métricas em formato Prometheus
      description: >
        Registrado apenas quando METRICS_ENABLED=true; caso contrário a rota não existe e
        o 404 sai do handler padrão. Em produção, com METRICS_PUBLIC=false, requisição
        vinda do proxy público também recebe 404 — o endpoint expõe topologia, nomes de
        rota e volume de tráfego, e um 403 confirmaria a quem varre que ele existe.
      operationId: metrics
      security: []
      responses:
        '200':
          description: Métricas em formato de exposição do Prometheus
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP iam_build_info Versão em execução
                # TYPE iam_build_info gauge
                iam_build_info{version="0.1.0",commit="e54a0fd",node_version="v22.14.0"} 1
        '404':
          description: Métricas desabilitadas por configuração ou requisição externa recusada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /.well-known/jwks.json:
    get:
      tags: [jwks]
      summary: Conjunto de chaves públicas de verificação (JWK Set)
      description: >
        Publica as chaves públicas Ed25519 (active, next e retired ainda dentro da janela de
        graça) no formato JWK Set. Consumido pelos microsserviços para validar os tokens
        offline. Nunca expõe material privado.
      operationId: jwks
      security: []
      responses:
        '200':
          description: Conjunto de chaves públicas
          headers:
            Cache-Control:
              description: Resposta cacheável por 5 minutos.
              schema:
                type: string
                example: public, max-age=300
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksResponse'
              example:
                keys:
                  - kty: OKP
                    crv: Ed25519
                    x: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
                    kid: 0193b6e2-7f00-7cd1-9a3e-2b7c9f0a1d42
                    use: sig
                    alg: EdDSA
  /auth/login:
    post:
      tags: [auth]
      summary: Autentica e-mail + senha e emite os tokens
      description: >
        Falha de credencial responde 401 com mensagem única e genérica, sem distinguir
        usuário inexistente de senha errada. Rate limit por IP; excedido, 429 com Retry-After.
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: >-
            Tokens emitidos, ou o desafio de segundo fator quando a conta tem MFA ativo. O
            desafio é metade do caminho feliz, não erro: o cliente distingue pelo campo
            `mfa_required`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/DesafioDeMfa'
        '400':
          description: Requisição inválida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Credenciais inválidas
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limit excedido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /oauth/token:
    post:
      tags: [oauth]
      summary: Emite um access token pelos grants da RFC 6749
      description: >
        Corpo em `application/x-www-form-urlencoded`; corpo JSON responde `invalid_request`.
        O cliente autentica por `Authorization: Basic` ou pelos campos `client_id`/
        `client_secret` no corpo — usar os dois na mesma requisição é `invalid_request`.
        Toda resposta traz `Cache-Control: no-store`. O erro segue a RFC 6749 §5.2, não o
        problem+json do resto da plataforma.
      operationId: oauthToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Token emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: >-
            `invalid_request`, `invalid_grant`, `unauthorized_client`,
            `unsupported_grant_type` ou `invalid_scope`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: >-
            `invalid_client` — resposta única para cliente inexistente, removido,
            desabilitado ou com segredo errado. Acompanha `WWW-Authenticate: Basic`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '429':
          description: '`slow_down` — rate limit excedido'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
  /.well-known/oauth-authorization-server:
    get:
      tags: [oauth]
      summary: Metadados do servidor de autorização (RFC 8414)
      description: >
        Descreve o que o servidor faz agora: com o `password` grant desligado, ele não
        aparece em `grant_types_supported`.
      operationId: oauthMetadata
      security: []
      responses:
        '200':
          description: Documento de metadados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationServerMetadata'
  /auth/mfa:
    get:
      tags: [mfa]
      summary: Estado do segundo fator do usuário autenticado
      description: >
        Nunca devolve o segredo. `pending` é cadastro iniciado e não confirmado, que não
        protege a conta.
      operationId: mfaEstado
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Estado do fator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoDeMfa'
        '401':
          description: Token inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/mfa/totp:
    post:
      tags: [mfa]
      summary: Inicia o cadastro de TOTP
      description: >
        Devolve o segredo uma única vez. O fator nasce pendente e não protege nada até ser
        confirmado com um código válido.
      operationId: mfaIniciarCadastro
      security: [{ BearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                label:
                  type: string
                  maxLength: 64
      responses:
        '201':
          description: Cadastro iniciado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CadastroDeTotp'
        '409':
          description: Já existe fator ativo
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags: [mfa]
      summary: Desativa o segundo fator (exige a senha atual)
      description: >
        A senha é exigida porque, sem ela, um access token roubado desligaria o segundo
        fator da vítima. Apaga também os códigos de recuperação.
      operationId: mfaDesativar
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [senha]
              properties:
                senha:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        '204':
          description: Fator removido
        '401':
          description: Senha inválida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Sem fator habilitado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/mfa/totp/confirm:
    post:
      tags: [mfa]
      summary: Ativa o fator e entrega os códigos de recuperação
      description: >
        O código válido é a prova de posse do dispositivo. Os códigos de recuperação
        aparecem uma única vez — não há endpoint para recuperá-los.
      operationId: mfaConfirmarCadastro
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
      responses:
        '200':
          description: Fator ativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmacaoDeTotp'
        '400':
          description: Código inválido — o cadastro segue pendente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Nenhum cadastro pendente
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/mfa/recovery-codes:
    post:
      tags: [mfa]
      summary: Regenera os códigos de recuperação (exige a senha atual)
      description: O conjunto anterior deixa de valer inteiro, usado ou não.
      operationId: mfaRegenerarCodigos
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [senha]
              properties:
                senha:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        '200':
          description: Códigos novos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodigosDeRecuperacao'
        '401':
          description: Senha inválida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/mfa/verify:
    post:
      tags: [mfa]
      summary: Responde ao desafio e emite o par de tokens
      description: >
        Aceita `code` (TOTP) ou `recovery_code`, nunca os dois. Desafio inexistente,
        expirado, com tentativas esgotadas e código errado respondem a mesma coisa.
      operationId: mfaVerificar
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mfa_token]
              properties:
                mfa_token:
                  type: string
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
                recovery_code:
                  type: string
      responses:
        '200':
          description: Tokens emitidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Desafio inválido, expirado, esgotado ou resposta errada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limit excedido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /users/{id}/mfa/reset:
    post:
      tags: [mfa]
      summary: Remove o segundo fator de um usuário e derruba as sessões dele
      description: >
        Saída para conta travada. Exige a permissão `mfa:reset`, que no seed só o superadmin
        tem.
      operationId: mfaResetAdministrativo
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Fator removido
        '403':
          description: Sem a permissão mfa:reset
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Usuário sem fator
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotaciona o refresh token e emite um novo par
      description: >
        Troca um refresh token válido por um novo par (access + refresh) e invalida o token
        apresentado. Reapresentar um token já rotacionado derruba a sessão inteira. Falha
        responde 401 com mensagem única e genérica. Rate limit por IP; excedido, 429 com
        Retry-After.
      operationId: authRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Novo par de tokens emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          description: Requisição inválida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Refresh token inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limit excedido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoga o par de tokens (denylist + refresh)
      description: >
        Coloca o jti do access token na denylist (com TTL igual ao exp) e revoga o refresh
        token. Uma requisição subsequente com o mesmo access token responde 401.
      operationId: authLogout
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Sessão encerrada
        '401':
          description: Token ausente, inválido ou revogado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/me:
    get:
      tags: [auth]
      summary: Perfil do usuário autenticado
      description: >
        Devolve o perfil do usuário resolvido a partir do access token (id, e-mail, status e
        papéis). Nunca inclui o hash de senha.
      operationId: authMe
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Perfil do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Token ausente, inválido ou revogado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /roles:
    post:
      tags: [rbac]
      summary: Cria um papel
      description: Exige a permissão `roles:write`.
      operationId: rolesCreate
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 64, pattern: '^[a-z0-9_-]+$' }
                description: { type: string, maxLength: 256 }
      responses:
        '201':
          description: Papel criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/ProblemValidacao' }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '409':
          description: Papel com esse nome já existe
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [rbac]
      summary: Lista papéis com paginação
      description: Exige a permissão `roles:read`.
      operationId: rolesList
      security: [{ BearerAuth: [] }]
      parameters:
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Página de papéis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleList' }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
  /roles/{id}:
    get:
      tags: [rbac]
      summary: Detalha um papel e suas permissões
      description: Exige a permissão `roles:read`.
      operationId: rolesGet
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Papel com permissões
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleDetail' }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '404': { $ref: '#/components/responses/ProblemNaoEncontrado' }
    patch:
      tags: [rbac]
      summary: Renomeia/atualiza um papel
      description: Exige `roles:write`. Papel `is_system` é imutável (409).
      operationId: rolesUpdate
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 64, pattern: '^[a-z0-9_-]+$' }
                description: { type: string, maxLength: 256, nullable: true }
      responses:
        '200':
          description: Papel atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/ProblemValidacao' }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '404': { $ref: '#/components/responses/ProblemNaoEncontrado' }
        '409': { $ref: '#/components/responses/ProblemConflito' }
    delete:
      tags: [rbac]
      summary: Remove um papel
      description: Exige `roles:delete`. Papel `is_system` é imutável (409).
      operationId: rolesDelete
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removido }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '404': { $ref: '#/components/responses/ProblemNaoEncontrado' }
        '409': { $ref: '#/components/responses/ProblemConflito' }
  /roles/{id}/permissions:
    post:
      tags: [rbac]
      summary: Associa permissões a um papel
      description: >-
        Exige o papel `superadmin`: quem tem apenas `roles:write` poderia acrescentar
        permissões ao próprio papel e escalar privilégio no login seguinte.
        Idempotente e atômico. A permissão curinga `*` nunca é associada (409).
      operationId: rolePermissionsAdd
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [permission_ids]
              properties:
                permission_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, format: uuid }
      responses:
        '204': { description: Associado }
        '400': { $ref: '#/components/responses/ProblemValidacao' }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '404': { $ref: '#/components/responses/ProblemNaoEncontrado' }
        '409': { $ref: '#/components/responses/ProblemConflito' }
  /roles/{id}/permissions/{permId}:
    delete:
      tags: [rbac]
      summary: Desassocia uma permissão de um papel
      description: Exige `roles:write`.
      operationId: rolePermissionsRemove
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: permId, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Desassociado }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '404': { $ref: '#/components/responses/ProblemNaoEncontrado' }
  /permissions:
    post:
      tags: [rbac]
      summary: Cria uma permissão
      description: Exige `permissions:write`. Formato `recurso:acao`.
      operationId: permissionsCreate
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  {
                    type: string,
                    minLength: 3,
                    maxLength: 64,
                    pattern: '^[a-z0-9_-]+:([a-z0-9_-]+|\*)$',
                  }
                description: { type: string, maxLength: 256 }
      responses:
        '201':
          description: Permissão criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Permission' }
        '400': { $ref: '#/components/responses/ProblemValidacao' }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '409':
          description: Permissão com esse nome já existe
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [rbac]
      summary: Lista permissões com paginação
      description: Exige `permissions:read`.
      operationId: permissionsList
      security: [{ BearerAuth: [] }]
      parameters:
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Página de permissões
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionList' }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
  /permissions/{id}:
    delete:
      tags: [rbac]
      summary: Remove uma permissão
      description: Exige `permissions:delete`. Permissão `is_system` é imutável (409).
      operationId: permissionsDelete
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removida }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '404': { $ref: '#/components/responses/ProblemNaoEncontrado' }
        '409': { $ref: '#/components/responses/ProblemConflito' }
  /users/{id}/roles:
    get:
      tags: [rbac]
      summary: Lista os papéis de um usuário
      description: Exige `roles:read`.
      operationId: userRolesList
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Papéis do usuário
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserRoles' }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '404': { $ref: '#/components/responses/ProblemNaoEncontrado' }
    post:
      tags: [rbac]
      summary: Atribui papéis a um usuário (superadmin)
      description: Escrita exclusiva do papel `superadmin` (RF-09).
      operationId: userRolesAssign
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role_ids]
              properties:
                role_ids:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: string, format: uuid }
      responses:
        '204': { description: Atribuído }
        '400': { $ref: '#/components/responses/ProblemValidacao' }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '404': { $ref: '#/components/responses/ProblemNaoEncontrado' }
  /users/{id}/roles/{roleId}:
    delete:
      tags: [rbac]
      summary: Revoga um papel de um usuário (superadmin)
      description: Escrita exclusiva do papel `superadmin` (RF-09).
      operationId: userRolesRevoke
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: roleId, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Revogado }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '404': { $ref: '#/components/responses/ProblemNaoEncontrado' }
  /policies:
    post:
      tags: [abac]
      summary: Cria uma política
      description: >-
        Exige `policies:write`. A condição é validada contra a gramática fechada e contra os
        limites de forma antes de persistir; fora deles, 400 e nada é gravado.
      operationId: policiesCreate
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, effect, resource_type, action, condition]
              properties:
                name: { type: string, minLength: 2, maxLength: 64, pattern: '^[a-z0-9_-]+$' }
                description: { type: string, maxLength: 256 }
                effect: { type: string, enum: [permit, deny] }
                resource_type: { type: string, minLength: 1, maxLength: 64 }
                action: { type: string, minLength: 1, maxLength: 64 }
                condition: { $ref: '#/components/schemas/PolicyCondition' }
                priority: { type: integer, minimum: 0, maximum: 1000, default: 0 }
                enabled: { type: boolean, default: true }
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '400': { $ref: '#/components/responses/ProblemValidacao' }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '409': { $ref: '#/components/responses/ProblemConflito' }
    get:
      tags: [abac]
      summary: Lista políticas
      description: Exige `policies:read`. Ordena por prioridade decrescente.
      operationId: policiesList
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: query, name: resource_type, schema: { type: string, maxLength: 64 } }
        - { in: query, name: enabled, schema: { type: boolean } }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Página de políticas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyList' }
        '400': { $ref: '#/components/responses/ProblemValidacao' }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
  /policies/evaluate:
    post:
      tags: [abac]
      summary: Avalia uma decisão de política (PDP online)
      description: >-
        Exige `policies:read`. Decide sem enforcement e sem carregar recurso: quem chama
        informa os atributos. Serve de depuração e de PDP para consumidores que precisem de
        decisão por atributo fora do IAM.
      operationId: policiesEvaluate
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subject, resource_type, resource, action]
              properties:
                subject:
                  type: object
                  additionalProperties: false
                  required: [sub]
                  properties:
                    sub: { type: string, minLength: 1, maxLength: 128 }
                    roles: { type: array, items: { type: string } }
                    perm: { type: array, items: { type: string } }
                resource_type: { type: string, minLength: 1, maxLength: 64 }
                resource:
                  description: Atributos do recurso alvo, por exemplo owner_id.
                  type: object
                action: { type: string, minLength: 1, maxLength: 64 }
                env:
                  type: object
                  additionalProperties: false
                  properties:
                    ip: { type: string }
                    now: { type: string, format: date-time }
      responses:
        '200':
          description: Decisão
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyDecision' }
        '400': { $ref: '#/components/responses/ProblemValidacao' }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
  /policies/{id}:
    get:
      tags: [abac]
      summary: Detalha uma política
      description: Exige `policies:read`. Só o detalhe traz a condição.
      operationId: policiesGet
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Política
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyDetail' }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '404': { $ref: '#/components/responses/ProblemNaoEncontrado' }
    patch:
      tags: [abac]
      summary: Atualiza uma política
      description: >-
        Exige `policies:write`. Política is_system é imutável (409). A escrita invalida o
        cache do PDP no processo.
      operationId: policiesUpdate
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 64, pattern: '^[a-z0-9_-]+$' }
                description: { type: string, maxLength: 256, nullable: true }
                effect: { type: string, enum: [permit, deny] }
                resource_type: { type: string, minLength: 1, maxLength: 64 }
                action: { type: string, minLength: 1, maxLength: 64 }
                condition: { $ref: '#/components/schemas/PolicyCondition' }
                priority: { type: integer, minimum: 0, maximum: 1000 }
                enabled: { type: boolean }
      responses:
        '200':
          description: Atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '400': { $ref: '#/components/responses/ProblemValidacao' }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '404': { $ref: '#/components/responses/ProblemNaoEncontrado' }
        '409': { $ref: '#/components/responses/ProblemConflito' }
    delete:
      tags: [abac]
      summary: Remove uma política
      description: Exige `policies:delete`. Política is_system é imutável (409).
      operationId: policiesDelete
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removida }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '404': { $ref: '#/components/responses/ProblemNaoEncontrado' }
        '409': { $ref: '#/components/responses/ProblemConflito' }
  /clients:
    post:
      tags: [clients]
      summary: Cria um cliente de API
      description: >-
        Exige o papel `superadmin`: conceder escopo é conceder privilégio. O `client_id` e o
        `client_secret` são gerados pelo servidor; o segredo aparece só nesta resposta.
      operationId: clientsCreate
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, scopes]
              properties:
                name: { type: string, minLength: 2, maxLength: 128 }
                description: { type: string, maxLength: 256 }
                scopes:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, pattern: '^[a-z0-9_-]+:[a-z0-9_-]+$' }
                grant_types:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [client_credentials, password, refresh_token] }
                access_token_ttl_seconds: { type: integer, minimum: 60, maximum: 3600 }
      responses:
        '201':
          description: Cliente criado, com o segredo em claro
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiClientCreated' }
        '400': { $ref: '#/components/responses/ProblemValidacao' }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '409': { $ref: '#/components/responses/ProblemConflito' }
        '422':
          description: Escopo desconhecido; o detail lista quais faltaram
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [clients]
      summary: Lista clientes de API
      description: Exige `clients:read`. Removidos ficam fora por padrão.
      operationId: clientsList
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [active, disabled, deleted] } }
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Página de clientes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiClientList' }
        '400': { $ref: '#/components/responses/ProblemValidacao' }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
  /clients/{id}:
    get:
      tags: [clients]
      summary: Detalha um cliente de API
      description: Exige `clients:read`. Nunca devolve segredo nem hash.
      operationId: clientsGet
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Cliente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiClient' }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '404': { $ref: '#/components/responses/ProblemNaoEncontrado' }
    patch:
      tags: [clients]
      summary: Altera um cliente de API
      description: >-
        Autoridade por campo. `name`, `description` e `status` exigem `clients:write`;
        `scopes`, `grant_types` e `access_token_ttl_seconds` exigem o papel `superadmin`.
        Corpo que mistura os dois grupos é tratado como privilegiado inteiro: sem
        `superadmin`, responde 403 sem aplicar nada.
      operationId: clientsUpdate
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 2, maxLength: 128 }
                description: { type: string, maxLength: 256, nullable: true }
                status: { type: string, enum: [active, disabled] }
                scopes:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, pattern: '^[a-z0-9_-]+:[a-z0-9_-]+$' }
                grant_types:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [client_credentials, password, refresh_token] }
                access_token_ttl_seconds:
                  { type: integer, minimum: 60, maximum: 3600, nullable: true }
      responses:
        '200':
          description: Cliente atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiClient' }
        '400': { $ref: '#/components/responses/ProblemValidacao' }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '404': { $ref: '#/components/responses/ProblemNaoEncontrado' }
        '409': { $ref: '#/components/responses/ProblemConflito' }
        '422':
          description: Escopo desconhecido
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [clients]
      summary: Remove um cliente de API
      description: >-
        Exige `clients:delete`. Remoção lógica: o `client_id` fica queimado e a autenticação
        passa a negar imediatamente.
      operationId: clientsDelete
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removido }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '404': { $ref: '#/components/responses/ProblemNaoEncontrado' }
        '409': { $ref: '#/components/responses/ProblemConflito' }
  /clients/{id}/secret:
    post:
      tags: [clients]
      summary: Rotaciona o segredo do cliente
      description: >-
        Exige `clients:write`. O segredo anterior continua aceito durante a janela de
        sobreposição, para o cliente trocar sem downtime durante o deploy. `overlap_seconds`
        zero encerra o anterior no ato.
      operationId: clientsRotateSecret
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                overlap_seconds: { type: integer, minimum: 0, maximum: 604800 }
      responses:
        '200':
          description: Segredo rotacionado, com o novo valor em claro
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RotatedSecret' }
        '400': { $ref: '#/components/responses/ProblemValidacao' }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '404': { $ref: '#/components/responses/ProblemNaoEncontrado' }
        '409': { $ref: '#/components/responses/ProblemConflito' }
  /clients/{id}/secret/revoke-previous:
    post:
      tags: [clients]
      summary: Encerra a sobreposição de segredo
      description: >-
        Exige `clients:write`. O caminho de incidente, para quando o segredo antigo vazou e
        não se pode esperar a janela fechar sozinha.
      operationId: clientsRevokePreviousSecret
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Sobreposição encerrada }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '404': { $ref: '#/components/responses/ProblemNaoEncontrado' }
        '409': { $ref: '#/components/responses/ProblemConflito' }
  /admin/keys:
    get:
      tags: [keys]
      summary: Lista os metadados das chaves de assinatura
      description: Exige a permissão `keys:read`. Nunca devolve material privado.
      operationId: keysList
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [active, next, retired] } }
      responses:
        '200':
          description: Chaves com seus metadados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyList' }
        '400': { $ref: '#/components/responses/ProblemValidacao' }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
  /admin/keys/prepare:
    post:
      tags: [keys]
      summary: Gera e publica a próxima chave
      description: >-
        Exige `keys:write`. Idempotente: com uma chave pré-publicada já presente, devolve 200
        com ela em vez de gerar outra. A partir daqui corre a janela de pré-publicação, que a
        promoção exige ter sido cumprida.
      operationId: keysPrepare
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Já existia uma chave pré-publicada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreparedKey' }
        '201':
          description: Chave pré-publicada criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreparedKey' }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
  /admin/keys/rotate:
    post:
      tags: [keys]
      summary: Promove a chave pré-publicada e aposenta a ativa
      description: >-
        Exige `keys:write`. Recusa com 409 quando não há chave pré-publicada, quando ela ainda
        não cumpriu a janela de pré-publicação, ou quando outra instância está rotacionando.
      operationId: keysRotate
      security: [{ BearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                motivo: { type: string, minLength: 3, maxLength: 256 }
      responses:
        '200':
          description: Rotação concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RotationResult' }
        '400': { $ref: '#/components/responses/ProblemValidacao' }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '409': { $ref: '#/components/responses/ProblemConflito' }
  /admin/keys/{kid}/revoke:
    post:
      tags: [keys]
      summary: Revoga uma chave imediatamente
      description: >-
        Exige o **papel** `superadmin`, não a permissão de escrita: encerrar uma chave
        invalida de uma vez todos os tokens que ela assinou. Se o alvo for a chave ativa, a
        pré-publicada é promovida no mesmo passo — sem candidata pronta, responde 409.
      operationId: keysRevoke
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: kid, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [motivo]
              properties:
                motivo: { type: string, minLength: 3, maxLength: 256 }
      responses:
        '200':
          description: Chave revogada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevocationResult' }
        '400': { $ref: '#/components/responses/ProblemValidacao' }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '404': { $ref: '#/components/responses/ProblemNaoEncontrado' }
        '409': { $ref: '#/components/responses/ProblemConflito' }
  /audit/events:
    get:
      tags: [audit]
      summary: Lista eventos da trilha de auditoria
      description: >-
        Exige a permissão `audit:read`. Pagina por posição na cadeia: `proximo_cursor` é a
        posição em que a próxima página começa. Ator e alvo só aceitam UUID — a trilha não é
        consultável por e-mail, para a leitura não virar um oráculo de enumeração.
      operationId: auditListEvents
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: query, name: type, schema: { type: string } }
        - { in: query, name: actor_id, schema: { type: string, format: uuid } }
        - { in: query, name: target_id, schema: { type: string, format: uuid } }
        - { in: query, name: outcome, schema: { type: string, enum: [success, failure] } }
        - { in: query, name: de, schema: { type: string, format: date-time } }
        - { in: query, name: ate, schema: { type: string, format: date-time } }
        - { in: query, name: cursor, schema: { type: integer, minimum: 0 } }
        - {
            in: query,
            name: limite,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
      responses:
        '200':
          description: Página de eventos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventPage' }
        '400': { $ref: '#/components/responses/ProblemValidacao' }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '503': { $ref: '#/components/responses/ProblemTrilhaIndisponivel' }
    post:
      tags: [audit]
      summary: Recusa escrita externa na trilha
      description: >-
        Responde sempre 405. A rota existe para a recusa fazer parte do contrato: a trilha é
        alimentada de dentro do processo, e um 404 deixaria a ausência parecendo esquecimento.
      operationId: auditRejectWrite
      security: [{ BearerAuth: [] }]
      responses:
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '405': { $ref: '#/components/responses/ProblemMetodoNaoPermitido' }
  /audit/events/{seq}:
    get:
      tags: [audit]
      summary: Obtém um evento pela posição na cadeia
      description: >-
        Exige `audit:read`. O detalhe acrescenta `prev_hash`, que a listagem omite: numa
        página parcial ele só induziria a tentar validar a cadeia com o pedaço errado.
      operationId: auditGetEvent
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: path, name: seq, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Evento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventDetail' }
        '400': { $ref: '#/components/responses/ProblemValidacao' }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '404': { $ref: '#/components/responses/ProblemNaoEncontrado' }
        '503': { $ref: '#/components/responses/ProblemTrilhaIndisponivel' }
  /audit/integrity:
    get:
      tags: [audit]
      summary: Verifica a integridade da cadeia numa faixa
      description: >-
        Exige `audit:verify`. Recomputa o elo de cada evento da faixa e confronta a cadeia com
        a âncora gravada no PostgreSQL. Trilha adulterada responde **200** com
        `integra: false` — a verificação executou, e o achado é o resultado; 503 fica para
        falha de infraestrutura durante a varredura. Faixa acima do teto configurado é 400:
        verificar a trilha inteira numa requisição prende o processo.
      operationId: auditVerifyIntegrity
      security: [{ BearerAuth: [] }]
      parameters:
        - { in: query, name: de, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: ate, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Relatório de integridade
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditIntegrityReport' }
        '400': { $ref: '#/components/responses/ProblemValidacao' }
        '401': { $ref: '#/components/responses/ProblemNaoAutenticado' }
        '403': { $ref: '#/components/responses/ProblemSemPermissao' }
        '503': { $ref: '#/components/responses/ProblemTrilhaIndisponivel' }
